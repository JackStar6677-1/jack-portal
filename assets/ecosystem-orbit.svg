  <circle cx="260" cy="160" r="38" fill="#100b1f" stroke="#f5c542" stroke-width="2"/>
  <text x="260" y="155" fill="#f8f7ff" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="17" font-weight="700">JACK</text>
  <text x="260" y="174" fill="#b8adc9" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="10">SYSTEMS CORE</text>
