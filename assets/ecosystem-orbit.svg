    <g><circle cx="105" cy="76" r="26" fill="#17102b" stroke="#22d3ee"/><text x="105" y="80" fill="#22d3ee">STAR</text></g>
    <g><circle cx="412" cy="83" r="31" fill="#17102b" stroke="#a855f7"/><text x="412" y="87" fill="#d9c5ff">IA HUB</text></g>
    <g><circle cx="425" cy="245" r="32" fill="#17102b" stroke="#f5c542"/><text x="425" y="249" fill="#f5c542">ODYSSEIA</text></g>
    <g><circle cx="111" cy="246" r="32" fill="#17102b" stroke="#22d3ee"/><text x="111" y="250" fill="#22d3ee">MONITOR</text></g>
  </g>
  <circle cx="176" cy="63" r="3" fill="#f5c542"/><circle cx="350" cy="267" r="3" fill="#22d3ee"/>
