<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" role="img" aria-labelledby="title desc">
  <title id="title">Ecosistema técnico</title>
  <desc id="desc">Núcleo de infraestructura conectado con software, observabilidad y DrakesCraft</desc>
  <defs>
    <radialGradient id="core"><stop stop-color="#f5c542" stop-opacity=".9"/><stop offset="1" stop-color="#a855f7" stop-opacity=".12"/></radialGradient>
    <linearGradient id="line"><stop stop-color="#f5c542"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g fill="none" stroke="#f5c542" opacity=".22">
